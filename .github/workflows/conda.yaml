# Verify that installation from conda-forge works as intended
name: Install from conda-forge

on:
  # 05:00 UTC = 06:00 CET = 07:00 CEST
  schedule:
  - cron: "0 5 * * *"
  # Uncomment to debug
  # pull_request:
  #   branches: [ main ]

env:
  # Oldest version that can reliably be downloaded
  gams-version: "48.7.0"
  # The latest version of pyam on conda-forge, v3.2.0,
  # includes the constraint python <3.14. Use a compatible version.
  python-version: "3.13"
  # Conda/libmamba sporadically chooses to install v0.7.0, which causes errors
  upstream-versions: '"pyam >= 1.6"'

jobs:
  conda:
    strategy:
      matrix:
        version:
        - { os: macos-latest,   spec: '"message-ix > 3.11"' }
        - { os: windows-latest, spec: "message-ix" }
      fail-fast: false

    runs-on: ${{ matrix.version.os }}
    name: ${{ matrix.version.os }}

    # As suggested by conda-incubator/setup-miniconda
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Setup Anaconda or miniconda
      uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: testenv
        channel-priority: strict
        channels: conda-forge
        python-version: ${{ env.python-version }}

    - name: Cache GAMS installer
      uses: actions/cache@v6
      with:
        path: |
          gams
        key: ${{ runner.os }}-gams${{ env.gams-version }}
        restore-keys: |
          ${{ runner.os }}-

    - uses: iiasa/actions/setup-gams@main
      with:
        version: ${{ env.gams-version }}
        license: ${{ secrets.GAMS_LICENSE }}

    - name: Install message-ix into 'testenv' conda environment
      # Also install pytest and packages required for testing. pip and related
      # tools support this via message_ix[testing], but conda does not.
      run: |
        conda install ${{ matrix.version.spec }} ${{ env.upstream-versions }} pytest asyncssh sphinx
        conda list
        conda info

    - name: Check message-ix and ixmp CLIs
      run: |
        message-ix show-versions
        ixmp --platform default list || true

    - name: Run a test from the test suite to touch JDBCBackend/Java via JPype
      run: pytest --pyargs message_ix -p ixmp.testing -p message_ix.testing -p no:faulthandler -k "test_add_cat" --verbose -rA --color=yes
